; PlatformIO Project Configuration File para STM32

[env:stm32_vcu]
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200

; Forzar C++17
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	; Descomenta las siguientes 2 líneas si usas el USB nativo del STM32 (USB OTG/FS) para el Serial Monitor:
	; -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	; -D USBCON

; Directorios de librerías locales
lib_extra_dirs = 
	; OJO: Asegúrate de que las librerías aquí dentro no usen código exclusivo de ESP32.
	Global-Library/lib 
	; CAN-Library/MART_CAN/lib ; <--- COMENTADO: MART_CAN (probablemente TWAI) no funcionará en STM32

lib_deps = 
	labfruits/Mcp320x@^1.4.2
	adafruit/Adafruit NeoPixel@^1.12.5
    
	; --- LIBRERÍAS CAN PARA STM32 (Opciones recomendadas) ---
	; Dependiendo de tu STM32 y tu transceptor, necesitarás una librería CAN compatible con "bxCAN" o "FDCAN".
	; Ejemplo para STM32duino (descomenta si vas a usar CAN integrado del STM32):
	; pazi88/STM32_CAN @ ^1.1.2