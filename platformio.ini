; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_g474re

; ============================================================================
;  VCU sobre STM32G474RE (NUCLEO-G474RE) — rama modJoseSTM32.
;  CAN por FDCAN1 (PA11/PA12), lo gestiona MART_CAN (HAL_FDCAN). Carga por ST-Link.
; ============================================================================
[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
; Carga por ST-Link (OpenOCD), igual que el BMS master. La ST-Link embebida de la
; NUCLEO-G474RE vale. {$PROG_PATH} entre llaves -> OpenOCD respeta espacios en la ruta.
debug_tool = stlink
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd.exe" -d1 -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32g4x.cfg -c "reset_config srst_only srst_nogate connect_assert_srst" -c "program {$PROG_PATH} verify" -c "reset run" -c "shutdown"
build_flags =
	-std=gnu++17
	-Wl,-u,_printf_float
	-D HAL_FDCAN_MODULE_ENABLED
lib_extra_dirs =
	lib/ESP32-Global-Library/lib
	lib/CAN-Library/lib
lib_deps =
	labfruits/Mcp320x@^1.4.2

; Entorno de tests unitarios en HOST (no requiere placa). Necesita un compilador
; nativo (gcc/clang/MinGW). Ejecutar con: pio test -e native_test
; Los sensores (AnalogSensor/PairedAnalogSensor) se compilan con un shim de Arduino.
[env:native_test]
platform = native
build_flags =
	-std=gnu++17
	-I test/native_shim
	-I src
lib_extra_dirs =
	lib/ESP32-Global-Library/lib
test_framework = unity
