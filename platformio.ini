; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_g474re

; ============================================================================
;  VCU sobre STM32G474RE (NUCLEO-G474RE) — rama modJoseSTM32.
;  CAN por FDCAN1 (PA11/PA12), lo gestiona MART_CAN (HAL_FDCAN). Carga por ST-Link.
; ============================================================================
[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
build_flags =
	-std=gnu++17
	-Wl,-u,_printf_float
	-D HAL_FDCAN_MODULE_ENABLED
lib_extra_dirs =
	lib/ESP32-Global-Library/lib
	lib/CAN-Library/lib
lib_deps =
	labfruits/Mcp320x@^1.4.2

; Entorno de tests unitarios en HOST (no requiere placa). Necesita un compilador
; nativo (gcc/clang/MinGW). Ejecutar con: pio test -e native_test
; Los sensores (AnalogSensor/PairedAnalogSensor) se compilan con un shim de Arduino.
[env:native_test]
platform = native
build_flags =
	-std=gnu++17
	-I test/native_shim
lib_extra_dirs =
	lib/ESP32-Global-Library/lib
test_framework = unity
